name: Deploy Court Kings to GitHub Pages

# Builds the single-file arcade game and publishes it to GitHub Pages so it can
# be opened on any phone at https://<user>.github.io/Brainstorm/
on:
  push:
    branches: ["claude/nba-3v3-arcade-game-evkenz"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build single-file game
        working-directory: arcade-hoops
        run: |
          npm install
          npm run build:single
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arcade-hoops/dist-single

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
